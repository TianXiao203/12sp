name: Build unicorn kernel (LineageOS + ReSukiSU + Docker cgroups)

# =============================================================================
# 小米 12S Pro (unicorn) + LineageOS 5.10 GKI 内核
#   - 源码: LineageOS/android_kernel_xiaomi_sm8450（+ devicetrees / modules）
#   - 集成 ReSukiSU（不是原版 KernelSU）
#   - 开启 Docker 所需的 cgroup / namespace 配置
#     重点是 CONFIG_CGROUP_DEVICE（GKI defconfig 里根本没有这一项）
#     以及 CONFIG_PID_NS（GKI 里被显式关闭成 "# CONFIG_PID_NS is not set"）
#
# 产物: Image / boot.img / .config / anykernel3-unicorn.zip / build.log
#
# 说明：内核分支必须与你手机上的 LineageOS 大版本一致，否则 vermagic 不匹配，
#       ROM 里现成的 vendor 模块会加载失败（能开机但 WiFi/蓝牙/音频废）。
#       adb shell getprop ro.lineage.build.version   查看设备版本
# =============================================================================

on:
  # 额外允许 push 自动触发：只对影响构建产物的文件生效（改文档/记忆不会触发）。
  # 这样不需要人工点 Run workflow 也能出包；inputs 为空时用 env 里的默认值。
  push:
    branches: [main]
    paths:
      - 'configs/**'
      - 'scripts/**'
      - 'anykernel3/**'
      - 'abi-baseline/abi-crcs.txt'
      - '.github/workflows/build-unicorn-kernel.yml'

  workflow_dispatch:
    inputs:
      lineage_branch:
        description: 'LineageOS 内核分支（已按实测设备钉为 23.2）'
        required: true
        default: 'lineage-23.2'
        type: choice
        options:
          - lineage-23.2
          - lineage-23.1
          - lineage-23.0
          - lineage-22.2
      kernel_commit:
        description: '钉住内核树 commit（设备 kernel release 含 -g<sha>，必须一致）'
        required: true
        default: 'ef362912d37b761041709638c1e571d6394e9558'
      clang_version:
        description: '⚠️ 必须与 ROM 里 vendor 模块用的编译器一致（CFI 类型哈希由编译器决定）。设备实测 clang 21.0.0 / r563880c'
        required: true
        default: 'clang-r563880c'
        type: choice
        options:
          - clang-r563880c
          - clang-r416183b
      device:
        description: '设备代号（小米 12S Pro = unicorn）'
        required: true
        default: 'unicorn'
      variant:
        description: '构建变体（gki 推荐）'
        required: true
        default: 'gki'
        type: choice
        options:
          - gki
          - consolidate
      lto:
        description: 'LTO 模式。必须与设备上能启动的内核一致（实测 FULL）；thin 只在 runner 内存不足、LTO 链接被 OOM 杀掉时兜底'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - thin
      resukisu_branch:
        description: 'ReSukiSU 分支/标签/commit'
        required: true
        default: 'main'
      resukisu_hook:
        description: 'KSU hook 模式（5.10 GKI 首选 kprobes）'
        required: true
        default: 'kprobes'
        type: choice
        options:
          - kprobes
          - tracepoint
          - manual
      enable_susfs:
        description: '开启 SUSFS（还需自行打内核侧补丁，默认关）'
        required: true
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'
      free_disk:
        description: '清理 runner 预装 SDK 腾磁盘。源码默认放 /mnt（约 70GB 空闲），所以默认不需要清理；只有改用 / 时才建议开'
        required: true
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'
      enable_swap:
        description: '创建 8GB swap（内存兜底；swapon 被拒也不会中断）'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      push_diag_branch:
        description: '失败时把 build.log 等诊断推到 ci-diag 分支（job log 接口要 admin 权限，匿名拿不到，推分支才能远程排错）'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      publish_artifacts:
        description: '成功时把 AK3 包推到 ci-artifacts 分支（artifact 下载要 auth；推分支后可用 git clone 匿名取，免去手工下载）'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  # 需要 write 才能把诊断/产物推到 ci-diag 与 ci-artifacts 分支
  contents: write

jobs:
  build:
    name: Build LineageOS 5.10 GKI kernel for unicorn
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    env:
      # 注意：WS 不在这里写死，由第一步「选择构建工作区」动态决定（优先 /mnt，
      # 那里默认有 ~74GB 空闲，而 / 只剩 ~14GB）。写在 job env 里会覆盖 GITHUB_ENV，
      # 所以必须留空。
      # 下面统一用 `inputs.x || 默认值`：手动触发时用表单值，
      # push 自动触发时（inputs 为空）也能拿到正确默认值。
      IN_BRANCH: ${{ inputs.lineage_branch || 'lineage-23.2' }}
      IN_COMMIT: ${{ inputs.kernel_commit || 'ef362912d37b761041709638c1e571d6394e9558' }}
      IN_CLANG: ${{ inputs.clang_version || 'clang-r563880c' }}
      IN_DEVICE: ${{ inputs.device || 'unicorn' }}
      IN_VARIANT: ${{ inputs.variant || 'gki' }}
      IN_LTO: ${{ inputs.lto || 'full' }}
      IN_KSU_BRANCH: ${{ inputs.resukisu_branch || 'main' }}
      IN_KSU_HOOK: ${{ inputs.resukisu_hook || 'kprobes' }}
      IN_ENABLE_SUSFS: ${{ inputs.enable_susfs || 'false' }}
      IN_SUSFS: ${{ inputs.enable_susfs || 'false' }}
      IN_FREE_DISK: ${{ inputs.free_disk || 'false' }}
      IN_SWAP: ${{ inputs.enable_swap || 'true' }}
      # 设备实测 uname -r，用于校验 vermagic 是否一致
      EXPECTED_RELEASE: '5.10.260-gki-gef362912d37b'

    steps:
      - name: Checkout build kit
        uses: actions/checkout@v4

      - name: 预检：仓库自带脚本/配置是否齐全（1 秒，防止白等 20 分钟）
        run: |
          # 为什么要有这一步：
          # Windows 上 core.ignorecase=true，.gitignore 的匹配也不区分大小写，
          # 所以 `AnyKernel3/` 曾经把仓库里的 `anykernel3/` 整个忽略掉，
          # 导致运行时 cp 找不到源文件、脚本静默秒退（Run#4 第 18 步就是这么挂的）。
          # 这里提前把需要的文件全查一遍，缺了就立刻失败并点名。
          set -uo pipefail
          MISS=0
          need="
            scripts/apply-configs.sh
            scripts/integrate-resukisu.sh
            scripts/preconfig-kernel.sh
            scripts/assemble-lineage-kernel.sh
            scripts/pack-anykernel3.sh
            scripts/verify-built-config.sh
            configs/docker-cgroup.fragment
            anykernel3/anykernel.sh
          "
          for f in $need; do
            if [ -f "$GITHUB_WORKSPACE/$f" ]; then
              printf '  [OK]   %s\n' "$f"
            else
              printf '  [MISS] %s\n' "$f"
              echo "::error title=仓库缺少文件::$f 没有被提交（很可能是 .gitignore 大小写冲突误伤）"
              MISS=$((MISS+1))
            fi
          done
          echo "  缺失: $MISS"
          [ "$MISS" -eq 0 ] || exit 1

      - name: 选择构建工作区（优先 /mnt，空间最大，因此无需清理系统目录）
        id: pick_ws
        run: |
          set -e
          echo "== 各挂载点可用空间 =="
          df -h / /mnt /home/runner /tmp 2>/dev/null || true
          echo
          # GitHub 托管 runner 上 /dev/root 只有 ~14GB 空闲，而 /mnt 通常有 ~70GB。
          # 但 /mnt 默认属于 root、runner 用户写不进去，所以这里先试着 mkdir，
          # 不行就用 sudo mkdir + chown 把所有权拿过来。
          # 这样就不必为了腾空间去删 runner 预装的 Android SDK / dotnet 之类。
          pick_dir() {
            local d="$1" sub="$d/wbkernel"
            [ -d "$d" ] || return 1
            if mkdir -p "$sub" 2>/dev/null; then printf '%s' "$sub"; return 0; fi
            if sudo mkdir -p "$sub" 2>/dev/null \
               && sudo chown "$(id -u):$(id -g)" "$sub" 2>/dev/null; then
              printf '%s' "$sub"; return 0
            fi
            return 1
          }

          BEST=""; BEST_FREE=0; BEST_MNT=""
          for d in /mnt /home/runner /tmp /; do
            [ -d "$d" ] || continue
            FREE_MB=$(df -Pm "$d" 2>/dev/null | awk 'NR==2{print $4}')
            [ -n "$FREE_MB" ] || continue
            echo "  候选 $d -> 可用 ${FREE_MB} MB"
            if [ "$FREE_MB" -gt "$BEST_FREE" ]; then
              if W="$(pick_dir "$d")"; then
                BEST="$W"; BEST_FREE="$FREE_MB"; BEST_MNT="$d"
              else
                echo "    -> 不可写，跳过"
              fi
            fi
          done
          if [ -z "$BEST" ]; then BEST="/home/runner/wbkernel"; BEST_MNT="/"; fi

          WS="${BEST%/}/kp"
          echo "WS=$WS" >> "$GITHUB_ENV"
          # 同时输出到 step output：${{ env.* }} 取不到 GITHUB_ENV 的值，
          # 而 actions/cache 的 path 只能用表达式，所以这里必须显式输出。
          echo "ws=$WS" >> "$GITHUB_OUTPUT"
          mkdir -p "$WS"
          echo "::notice title=构建工作区:: $WS (所在挂载点 $BEST_MNT，可用约 $((BEST_FREE/1024)) GB)"
          echo "== 选定后的空间 =="
          df -h "$WS"
          df -h / 2>/dev/null || true

      - name: 释放磁盘空间并尝试增加 swap（纯优化，任何子步骤失败都不中断）
        run: |
          # 注意：这一步只是内存兜底，绝不能让它把整个构建搞挂。
          # 源码已放 /mnt（~70GB），所以默认【不再清理系统目录】。
          echo "== 当前磁盘 =="; df -h / /mnt 2>/dev/null || true
          if [ "$IN_FREE_DISK" = "true" ]; then
            echo "[i] free_disk=true -> 清理 runner 预装 SDK（只删我们确定用不到的）"
            sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                        /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                        /usr/share/swift /usr/local/.ghcup \
                        2>/dev/null || echo "[WARN] 删除部分目录失败，忽略"
            sudo apt-get clean 2>/dev/null || true
          else
            echo "[i] free_disk=false -> 不清理任何系统目录（仅按需加 swap）"
          fi
          echo "== 清理后 =="; df -h / 2>/dev/null || true

          # swap 只是内存兜底；GitHub runner 上 swapon 有时会被拒，失败也必须继续
          if [ "$IN_SWAP" = "true" ]; then
            SWDIR="/mnt"
            [ -w "$SWDIR" ] || SWDIR="/"
            if [ ! -f "$SWDIR/swapfile" ]; then
              sudo fallocate -l 8G "$SWDIR/swapfile" 2>/dev/null \
                || sudo dd if=/dev/zero of="$SWDIR/swapfile" bs=1M count=8192 2>/dev/null \
                || echo "[WARN] 创建 swapfile 失败，忽略"
            fi
            sudo chmod 600 "$SWDIR/swapfile" 2>/dev/null || true
            sudo mkswap "$SWDIR/swapfile" >/dev/null 2>&1 || echo "[WARN] mkswap 失败，忽略"
            sudo swapon "$SWDIR/swapfile" 2>&1 || echo "[WARN] swapon 被拒，忽略"
          fi
          free -h 2>/dev/null || true
          echo "[OK] 准备步骤结束"

      - name: 安装构建依赖
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache cpio curl device-tree-compiler flex \
            g++-multilib gcc-multilib git gnupg gperf lib32ncurses5-dev \
            lib32readline-dev lib32z1-dev libelf-dev liblz4-tool libncurses5 \
            libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop \
            pngcrush python3 python3-pip rsync schedtool squashfs-tools xsltproc \
            zip zlib1g-dev kmod unzip
          git config --global user.name  "kernel-ci"
          git config --global user.email "kernel-ci@localhost"

      - name: 恢复内核源码 / clang 缓存（命中可省掉 10 分钟级 clone）
        id: cache_kernel
        continue-on-error: true
        uses: actions/cache@v4
        with:
          # key 里带 commit：换了 commit 就不会复用旧树（否则版本串/vendor 模块会对不上）
          key: sm8450-${{ inputs.lineage_branch || 'lineage-23.2' }}-${{ inputs.kernel_commit || 'ef362912d37b761041709638c1e571d6394e9558' }}-${{ inputs.clang_version || 'clang-r563880c' }}-v1
          path: |
            ${{ steps.pick_ws.outputs.ws }}/common
            ${{ steps.pick_ws.outputs.ws }}/prebuilts-master

      - name: 组装内核工作区（内核树 + clang + build + dtc + modules）
        run: |
          set -e
          bash "$GITHUB_WORKSPACE/scripts/assemble-lineage-kernel.sh" \
               "$WS" "$IN_BRANCH" "$IN_COMMIT" "$IN_CLANG"

      - name: 保存内核源码 / clang 缓存（失败不影响构建）
        if: always() && steps.cache_kernel.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          key: sm8450-${{ inputs.lineage_branch || 'lineage-23.2' }}-${{ inputs.kernel_commit || 'ef362912d37b761041709638c1e571d6394e9558' }}-${{ inputs.clang_version || 'clang-r563880c' }}-v1
          path: |
            ${{ steps.pick_ws.outputs.ws }}/common
            ${{ steps.pick_ws.outputs.ws }}/prebuilts-master

      - name: 写入 Docker/cgroup + ReSukiSU 配置
        run: |
          set -e
          bash "$GITHUB_WORKSPACE/scripts/apply-configs.sh" \
               "$WS/common" \
               "$GITHUB_WORKSPACE/configs/docker-cgroup.fragment"

      - name: 兜底：确保 ABI 危险项一定不在 defconfig 里
        run: |
          # 这三项会改变【被导出符号可见的结构体布局】，导致 ROM 里预编译的
          # vendor 模块集体拒载 → 卡在米标（详见 configs/docker-cgroup.fragment 开头）。
          #   NF_TABLES        -> struct net 多一个成员（net_namespace.h:145）
          #   SYSVIPC          -> struct task_struct 多两个成员（sched.h:973）
          #   BRIDGE_NETFILTER -> 与 net 路径相关，一并回避
          # 这里做一次硬兜底，防止以后有人手滑把它加回 fragment。
          set -e
          DEF="$WS/common/arch/arm64/configs/gki_defconfig"
          for k in CONFIG_NF_TABLES CONFIG_NF_TABLES_BRIDGE CONFIG_BRIDGE_NETFILTER CONFIG_SYSVIPC; do
            if grep -qE "^${k}=" "$DEF"; then
              echo "[WARN] $DEF 里出现了 $k，正在移除（它会让 ABI 与 ROM 模块不兼容）"
              sed -i "/^${k}=/d; /^# ${k} is not set/d" "$DEF"
            fi
          done
          echo "[+] 检查完毕，当前 gki_defconfig 里这几项的状态："
          grep -nE '^(# )?CONFIG_(NF_TABLES|NF_TABLES_BRIDGE|BRIDGE_NETFILTER|SYSVIPC|POSIX_MQUEUE|IPC_NS)=' "$DEF" || echo "    （都已不在文件中，即均为 n）"

      - name: 集成 ReSukiSU
        run: |
          set -e
          bash "$GITHUB_WORKSPACE/scripts/integrate-resukisu.sh" \
               "$WS/common" "$IN_KSU_BRANCH" "$IN_KSU_HOOK"

      - name: 按需开启 SUSFS
        if: ${{ (inputs.enable_susfs || 'false') == 'true' }}
        run: |
          set -e
          DEF="$WS/common/arch/arm64/configs/gki_defconfig"
          sed -i '/^CONFIG_KSU_SUSFS=/d' "$DEF"
          echo 'CONFIG_KSU_SUSFS=y' >> "$DEF"
          echo "::warning::已开 CONFIG_KSU_SUSFS=y；SUSFS 还需按内核版本打 susfs4ksu 内核侧补丁，否则编译会失败。"

      - name: 确认本树实际使用的 defconfig 碎片
        run: |
          set -e
          DEF="$WS/common/arch/arm64/configs/gki_defconfig"
          echo "== TARGET_KERNEL_CONFIG 期望的组合（gki_defconfig 是 base）=="
          echo "   gki_defconfig"
          echo "   vendor/waipio_GKI.config"
          echo "   vendor/xiaomi_GKI.config"
          echo "   vendor/${IN_DEVICE}_GKI.config"
          echo "   vendor/debugfs.config"
          echo "== 本树 vendor/ 下的碎片文件 =="
          ls -1 "$WS/common/arch/arm64/configs/vendor/" 2>/dev/null || true
          echo "== 关键配置最终状态（都应出现在 gki_defconfig 本体里）=="
          grep -nE '^(# )?CONFIG_(CGROUP_DEVICE|CGROUP_PIDS|PID_NS|USER_NS|POSIX_MQUEUE|IPC_NS|SECCOMP_FILTER|KSU|KSU_[A-Z_]+|KPROBES|LOCALVERSION|NF_TABLES|SYSVIPC|BRIDGE_NETFILTER)=' "$DEF" || true
          echo "== drivers/ 里的 KSU 集成痕迹 =="
          ls -l "$WS/common/drivers/kernelsu" || true
          grep -n kernelsu "$WS/common/drivers/Makefile" || true

      - name: 预生成合并 defconfig（gki_defconfig + 4 个碎片 + thin LTO）
        run: |
          # 脚本自己写日志（PRECONFIG_LOG），失败时会用 ::error:: 发出注解
          # —— 因为 Actions 的 job log 接口需要仓库 admin 权限（匿名 403），
          #    而 check-runs 的 annotations 是匿名可读的，这样失败原因才拿得到。
          set -uo pipefail
          export PRECONFIG_LOG="$GITHUB_WORKSPACE/build.log"
          bash "$GITHUB_WORKSPACE/scripts/preconfig-kernel.sh" "$WS" "$WS/out/common" "$IN_LTO"
          rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::error title=preconfig 失败::退出码 $rc（细节见上方 ::error:: 注解与 build.log 产物）"
            exit "$rc"
          fi
          echo "[OK] .config 已生成：$(ls -l "$WS/out/common/.config")"

      - name: 编译内核（直接 make Image）
        run: |
          # 为什么不用 build/build.sh：
          #  1) 它内部的 merge_defconfig_fragments 有 "ERROR! Detected overridden config!" /
          #     "ERROR! Treating config warnings as errors" 两处 1~2 秒就退出的硬检查，
          #     上一轮就是被它秒退、又被 `| tee` 吞掉退出码，表现为"0 秒成功"。
          #  2) 它只会合并 waipio_GKI.config，丢掉 xiaomi_/unicorn_GKI.config（设备专属配置）。
          #  3) 我们只需要 Image（AK3 只换 Image），不需要 modules/dtbs/vendor_dlkm。
          # 所以直接 make，和 LineageOS 自己在 kernel.mk 里做的事一致。
          set -eo pipefail
          cd "$WS/common"

          CLANG_BIN="$(ls -d "$WS"/prebuilts-master/clang/host/linux-x86/*/bin 2>/dev/null | head -1 || true)"
          if [ -z "$CLANG_BIN" ] || [ ! -x "$CLANG_BIN/clang" ]; then
            echo "::error title=clang 缺失::没找到 $WS/prebuilts-master/clang/host/linux-x86/*/bin/clang"
            ls -la "$WS/prebuilts-master/clang/host/linux-x86/" 2>&1 || true
            exit 1
          fi
          echo "[+] clang: $CLANG_BIN"
          "$CLANG_BIN/clang" --version | head -2
          export PATH="$CLANG_BIN:$PATH"

          export KBUILD_BUILD_HOST=build-host
          export KBUILD_BUILD_USER=build-user
          export SOURCE_DATE_EPOCH="$(git -C "$WS/common" log -1 --pretty=%ct)"
          export KBUILD_BUILD_TIMESTAMP="$(LC_ALL=C date -u -d "@$SOURCE_DATE_EPOCH" '+%a %b %d %H:%M:%S UTC %Y')"
          echo "[+] SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH  ($KBUILD_BUILD_TIMESTAMP)"

          OUT="$WS/out/common"
          mkdir -p "$OUT"
          [ -s "$OUT/.config" ] || { echo "::error::$OUT/.config 不存在（preconfig 没跑成功）"; exit 1; }
          # KCONFIG_CONFIG 用绝对路径：内核顶层 Makefile 是 `KCONFIG_CONFIG ?= .config`（相对），
          # 导出绝对路径可以确保 make 读到的就是我们刚生成的那份 .config。
          export KCONFIG_CONFIG="$(cd "$OUT" && pwd)/.config"
          echo "[+] 复用 $KCONFIG_CONFIG（$(grep -c '^CONFIG_' "$KCONFIG_CONFIG") 行 CONFIG_）"

          # 把关键编译期配置先打出来，便于事后核对
          grep -E '^CONFIG_(LOCALVERSION|LOCALVERSION_AUTO|LTO_CLANG|LTO_CLANG_THIN|LTO_CLANG_FULL|CFI_CLANG|KSU|CGROUP_DEVICE|CGROUP_PIDS|PID_NS|USER_NS|POSIX_MQUEUE|IPC_NS)=' \
            "$KCONFIG_CONFIG" | sed 's/^/    /' || true

          echo "== 开始编译 Image（预计 20~60 分钟）=="
          # 暂时关掉 -e：要把 make 的真实退出码抓出来并转成 ::error:: 注解，
          # 否则 `make | tee` 一旦失败就直接跳出，什么都看不到。
          set +e
          make O="$OUT" ARCH=arm64 LLVM=1 LLVM_IAS=1 \
               CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy \
               OBJDUMP=llvm-objdump READELF=llvm-readelf STRIP=llvm-strip \
               HOSTCC=clang HOSTCXX=clang++ HOSTLD=ld.lld \
               Image -j"$(nproc)" 2>&1 \
            | tee -a "$GITHUB_WORKSPACE/build.log"
          rc=${PIPESTATUS[0]}
          set -e

          if [ "$rc" -ne 0 ]; then
            echo "::error title=内核编译失败::make 退出码 $rc"
            # 把报错行发成注解（job log 接口要 admin 权限，注解匿名可读）
            grep -nE 'error:|Error [0-9]|No rule to make target|command not found|undefined reference|fatal error|Killed|out of memory' \
              "$GITHUB_WORKSPACE/build.log" 2>/dev/null | tail -25 | while IFS= read -r l; do
              printf '::error::%s\n' "$l"
            done
            tail -n 12 "$GITHUB_WORKSPACE/build.log" 2>/dev/null | while IFS= read -r l; do
              printf '::error::%s\n' "$l"
            done
            exit "$rc"
          fi

          echo "== 产物检查 =="
          ls -la "$OUT/arch/arm64/boot/" 2>/dev/null | head -20 || true
          IMG="$OUT/arch/arm64/boot/Image"
          if [ ! -s "$IMG" ]; then
            echo "::error title=产物缺失::没编出 $IMG"
            find "$OUT" -maxdepth 4 -type d | head -40 || true
            exit 1
          fi
          echo "[OK] 内核镜像: $IMG  ($(du -h "$IMG" | cut -f1))"

      - name: 校验最终 .config（仅供参考，不阻断打包/上传）
        continue-on-error: true
        run: |
          # 注意：内核已经编出来了，这一步只是体检报告，绝不能因为它挡住后面的 AK3 打包。
          KERNEL_TREE="$WS/common" bash "$GITHUB_WORKSPACE/scripts/verify-built-config.sh" "$WS/out" \
            || echo "::warning::校验脚本报了问题（把上面的表格发我即可），后续打包继续"

      - name: 核对内核 release（决定能否直接加载 ROM 现成模块）
        continue-on-error: true
        run: |
          OUT="$WS/out/common"
          # 优先直接读构建生成的 kernel.release（最准，不依赖 make 再跑一遍）
          REL=""
          if [ -f "$OUT/include/config/kernel.release" ]; then
            REL="$(cat "$OUT/include/config/kernel.release" 2>/dev/null || true)"
          fi
          if [ -z "$REL" ]; then
            CLANG_BIN="$(ls -d "$WS"/prebuilts-master/clang/host/linux-x86/*/bin 2>/dev/null | head -1 || true)"
            [ -n "$CLANG_BIN" ] && export PATH="$CLANG_BIN:$PATH"
            REL="$(make -s -C "$WS/common" O="$OUT" ARCH=arm64 LLVM=1 LLVM_IAS=1 kernelrelease 2>/dev/null || true)"
          fi
          echo "设备实测 uname -r : $EXPECTED_RELEASE"
          echo "本次构建 release  : ${REL:-<取不到>}"
          echo "内核树 .scmversion : $(cat "$WS/common/.scmversion" 2>/dev/null || echo '<不存在>')"
          echo "CONFIG_LOCALVERSION: $(grep -m1 '^CONFIG_LOCALVERSION=' "$WS/out/common/.config" 2>/dev/null || echo '<取不到>')"

          # ---------- 编译器一致性（这次卡开机 logo 的真凶）----------
          # ROM 里的 vendor_dlkm 模块是用官方那套 clang 编的；我们开了 CONFIG_CFI_CLANG=y，
          # 而 CFI 的【类型哈希由编译器算出来】。clang 版本不同 → 哈希不同 →
          # 内核与 vendor 模块对不上 → 控制台还没起来就出事，表现为【卡在开机 logo】。
          CLANGV="$(grep -m1 '^CONFIG_CLANG_VERSION=' "$WS/out/common/.config" 2>/dev/null || true)"
          CCTXT="$(grep -m1 '^CONFIG_CC_VERSION_TEXT=' "$WS/out/common/.config" 2>/dev/null || true)"
          echo "编译器           : ${CLANGV:-<取不到>}"
          echo "                 : ${CCTXT:-<取不到>}"
          case "$CLANGV" in
            CONFIG_CLANG_VERSION=210000)
              echo "::notice title=编译器一致:: clang 21 / r563880c，与设备内核相同，CFI 类型哈希可匹配" ;;
            *)
              echo "::error title=编译器不一致::本次=$CLANGV  设备=CONFIG_CLANG_VERSION=210000（clang 21 / r563880c）"
              echo "::error::${CCTXT:-<取不到 CC_VERSION_TEXT>}"
              echo "::error::clang 版本不同会让 CFI 类型哈希对不上；刷进去会【卡在开机 logo】。先别刷。"
              echo "::error::把 clang_version 改成 clang-r563880c 重新构建。" ;;
          esac

          if [ "$REL" = "$EXPECTED_RELEASE" ]; then
            echo "::notice title=版本串一致:: ${REL}  -> 只需刷 boot.img / AK3，ROM 里现成的 vendor 模块可直接加载"
          else
            # 用 ::error:: 而不是 ::warning::，并且把【两侧的实际值】都写进注解 ——
            # 这样即使拿不到 job log（匿名 API 是 403），也能从 annotations 远程读出差异。
            echo "::error title=版本串不一致::本次构建=[${REL:-<取不到>}]  设备=[$EXPECTED_RELEASE]"
            echo "::error::本次构建 kernel.release = ${REL:-<取不到>}"
            echo "::error::设备实测 uname -r      = $EXPECTED_RELEASE"
            echo "::error::内核查到的 .scmversion = $(cat "$WS/common/.scmversion" 2>/dev/null || echo '<不存在>')"
            echo "::error::刷这个内核会让 ROM 现成的 vendor 模块加载失败（Wi-Fi/蓝牙/音频废掉），先别刷。"
          fi

      - name: 收集产物并打包 AnyKernel3
        run: |
          # 刻意不开 set -e：每一步都显式判错，并把报错发成 ::error:: 注解
          # （Actions 的 job log 接口要仓库 admin 权限，匿名 403；
          #   check-runs 的 annotations 匿名可读，所以失败必须发注解）
          set -uo pipefail

          IMAGE="$(find "$WS/out" -maxdepth 8 -type f -name 'Image' -print -quit 2>/dev/null || true)"
          if [ -z "$IMAGE" ]; then
            echo "::error title=产物缺失::没找到 Image，编译产物不完整"
            find "$WS/out" -maxdepth 4 -type d 2>/dev/null | head -40 \
              | while IFS= read -r l; do printf '::error::%s\n' "$l"; done
            exit 1
          fi
          echo "[+] Image = $IMAGE ($(du -h "$IMAGE" | cut -f1))"

          mkdir -p "$GITHUB_WORKSPACE/upload" "$GITHUB_WORKSPACE/ak3dist"
          cp -f "$IMAGE" "$GITHUB_WORKSPACE/ak3dist/Image"
          cp -f "$IMAGE" "$GITHUB_WORKSPACE/upload/Image"

          for f in boot.img vendor_dlkm.img dtb.img dtbo.img; do
            SRC="$(find "$WS/out" -maxdepth 6 -type f -name "$f" -print -quit 2>/dev/null || true)"
            if [ -n "$SRC" ]; then cp -f "$SRC" "$GITHUB_WORKSPACE/upload/"; echo "  [+] $f"; fi
          done

          CFG="$(find "$WS/out" -maxdepth 8 -type f -name '.config' -print -quit 2>/dev/null || true)"
          if [ -n "$CFG" ]; then cp -f "$CFG" "$GITHUB_WORKSPACE/upload/kernel.config.txt"; fi

          # ABI 预检要用：内核为每个导出符号算出的 CRC。
          # 两条路，按可靠性依次尝试：
          #   1) Module.symvers —— 但只编 Image 时 modpost 不产出它（实测不存在）；
          #   2) 从 vmlinux（ELF，节表齐全）里解析 __ksymtab/__kcrctab。
          #      vmlinux 一定存在（Image 就是从它来的）。
          SYMV="$(find "$WS/out" -maxdepth 4 -type f -name 'Module.symvers' -print -quit || true)"
          if [ -n "$SYMV" ]; then
            cp -f "$SYMV" "$GITHUB_WORKSPACE/upload/kernel.Module.symvers"
            echo "[+] Module.symvers 已收集: $SYMV ($(wc -l < "$SYMV") 行)"
          else
            echo "[i] 没有 Module.symvers（只编 Image 时不产出），改从 vmlinux 解析符号 CRC"
            VMLINUX="$(find "$WS/out" -maxdepth 4 -type f -name 'vmlinux' -print -quit || true)"
            if [ -n "$VMLINUX" ]; then
              echo "[i] vmlinux = $VMLINUX  ($(du -h "$VMLINUX" | cut -f1))"
              if python3 "$GITHUB_WORKSPACE/scripts/check-abi-crc.py" dump-vmlinux "$VMLINUX" \
                   -o "$GITHUB_WORKSPACE/upload/kernel.Module.symvers" 2>&1 | tee -a "$GITHUB_WORKSPACE/build.log"; then
                echo "[+] 已从 vmlinux 导出 $(wc -l < "$GITHUB_WORKSPACE/upload/kernel.Module.symvers") 个符号的 CRC"
              else
                rm -f "$GITHUB_WORKSPACE/upload/kernel.Module.symvers"
                echo "::warning title=vmlinux 解析失败::ABI 预检将无法执行（见 job 输出）"
              fi
            else
              echo "::warning title=缺 vmlinux::ABI 预检将无法执行"
            fi
          fi
          cp -f "$GITHUB_WORKSPACE/build.log" "$GITHUB_WORKSPACE/upload/" 2>/dev/null || true

          echo "== 调用 pack-anykernel3.sh =="
          bash "$GITHUB_WORKSPACE/scripts/pack-anykernel3.sh" \
               "$GITHUB_WORKSPACE/ak3dist" "$GITHUB_WORKSPACE/AnyKernel3" \
               "$GITHUB_WORKSPACE/upload/anykernel3-unicorn.zip" \
               2>&1 | tee -a "$GITHUB_WORKSPACE/build.log"
          rc=${PIPESTATUS[0]}
          echo "pack-anykernel3.sh 退出码 = $rc"
          if [ "$rc" -ne 0 ]; then
            echo "::error title=AK3 打包失败::pack-anykernel3.sh 退出码 $rc"
            tail -n 20 "$GITHUB_WORKSPACE/build.log" 2>/dev/null \
              | while IFS= read -r l; do printf '::error::%s\n' "$l"; done
            exit "$rc"
          fi

          echo "== upload/ 内容 =="
          ls -l "$GITHUB_WORKSPACE/upload/" 2>&1 || true

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: unicorn-lineage-kernel-resukisu-docker-cgroup
          if-no-files-found: warn
          retention-days: 30
          path: |
            upload/**
            build.log

      - name: 成功时把 AK3 包推到 ci-artifacts 分支（可匿名 clone，省掉手工下载）
        if: success() && (inputs.publish_artifacts || 'true') == 'true'
        continue-on-error: true
        run: |
          # 为什么要这一步：
          #   Artifacts 的下载接口需要 auth（匿名 401），所以产物只能靠人在网页上点下载。
          #   而 git 分支可以匿名 clone —— 把 AK3 zip 推到一个独立分支 ci-artifacts，
          #   之后就能用一条 git clone 直接拿到包（本机 adb 刷机链路也因此能全自动）。
          #   该分支每次都用 --orphan 重建，历史不会无限膨胀。
          set -uo pipefail
          cd "$GITHUB_WORKSPACE"
          ZIP="upload/anykernel3-unicorn.zip"
          if [ ! -f "$ZIP" ]; then
            echo "::warning title=无可发布产物::$ZIP 不存在，跳过"
            exit 0
          fi
          git config user.name  "kernel-ci"
          git config user.email "kernel-ci@localhost"
          mkdir -p art
          cp -f "$ZIP" art/anykernel3-unicorn.zip
          cp -f upload/kernel.config.txt art/ 2>/dev/null || true
          cp -f upload/kernel.Module.symvers art/ 2>/dev/null || true
          cp -f build.log art/build.log 2>/dev/null || true
          {
            echo "run_id=${{ github.run_id }}"
            echo "sha=${{ github.sha }}"
            echo "branch=$IN_BRANCH"
            echo "kernel_commit=$IN_COMMIT"
            echo "clang_version=$IN_CLANG"
            echo "lto=$IN_LTO"
            echo "kernel.release=$(cat "$WS/out/common/include/config/kernel.release" 2>/dev/null)"
            echo "scmversion=$(cat "$WS/common/.scmversion" 2>/dev/null)"
            echo "zip_bytes=$(stat -c %s art/anykernel3-unicorn.zip 2>/dev/null)"
            echo "zip_sha256=$(sha256sum art/anykernel3-unicorn.zip 2>/dev/null | cut -d' ' -f1)"
          } > art/INFO.txt 2>&1
          cat art/INFO.txt
          ls -l art/
          # 用 orphan 分支避免带上一堆源码历史
          git checkout -q --orphan ci-artifacts
          git rm -rq --cached . 2>/dev/null || true
          git add -f art
          git -c user.name=kernel-ci -c user.email=kernel-ci@localhost \
              commit -m "ci-artifacts: run ${{ github.run_id }} (${{ github.sha }})" \
              || echo "[i] 没有变更可提交"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
              ci-artifacts 2>&1 | tail -5
          echo "::notice title=产物已发布:: 分支 ci-artifacts/art/anykernel3-unicorn.zip（可匿名 clone）"

      - name: ABI 预检（与 ROM 的 vendor 模块比对符号 CRC）—— 不一致就别刷
        run: |
          # 为什么必须有这一步：
          #   自编内核和 ROM 里预编译的 /vendor/lib/modules/*.ko 是分离编译的。
          #   模块把"它需要的每个内核符号的 CRC"写在自己的 __versions 段里，
          #   内核加载模块时比对 CRC；不一致就拒载。而拒载最典型的后果是
          #   【显示驱动模块没加载 → 屏幕永远停在米标】，没有 panic、没有日志。
          #   所以在这里先用 ROM 模块的 CRC 基线核对一遍：CI 直接报红，别刷。
          #
          # 基线 abi-baseline/abi-crcs.txt 是从真机 /vendor/lib/modules 的
          # .ko 里抽出来的（scripts/check-abi-crc.py baseline）。
          set -uo pipefail
          BASE="$GITHUB_WORKSPACE/abi-baseline/abi-crcs.txt"
          SYMV="$GITHUB_WORKSPACE/upload/kernel.Module.symvers"
          if [ ! -f "$BASE" ]; then
            echo "::warning title=无 ABI 基线::找不到 $BASE，跳过 ABI 预检"
            exit 0
          fi
          if [ ! -f "$SYMV" ]; then
            echo "::error title=ABI 预检无法执行::没找到 $SYMV（既没用 Module.symvers，也没能从 vmlinux 解析出符号 CRC）—— 这属于工具失效，不代表 ABI 有问题，但**先别刷**，先修工具"
            exit 1
          fi
          set +e
          python3 "$GITHUB_WORKSPACE/scripts/check-abi-crc.py" check "$SYMV" -b "$BASE" \
            2>&1 | tee -a "$GITHUB_WORKSPACE/build.log"
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "::error title=ABI 不兼容，先别刷！::内核导出的符号 CRC 与 ROM vendor 模块不一致，刷进去会卡在开机 logo（模块全部拒载）。详情见 job 输出里的 [FAIL] 列表。"
            exit 1
          fi
          echo "::notice title=ABI 兼容::符号 CRC 与 ROM vendor 模块完全一致，可以刷"

      - name: 汇总诊断信息（无论成功失败都跑）
        if: always()
        run: |
          # 源码现在放 /mnt 之类的绝对路径，upload-artifact 的 path 不展开环境变量，
          # 所以先复制到一个工作区内的固定目录（diag/）再上传。
          set +e
          D="$GITHUB_WORKSPACE/diag"
          mkdir -p "$D/defconfig" "$D/out"
          cp -f "$GITHUB_WORKSPACE/build.log" "$D/" 2>/dev/null
          echo "== 工作区 ==" > "$D/env.txt"
          echo "WS=$WS" >> "$D/env.txt"
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE" >> "$D/env.txt"
          { echo "== df =="; df -h; echo; echo "== free =="; free -h; echo;
            echo "== WS 顶层 =="; ls -la "$WS" 2>&1; } >> "$D/env.txt" 2>&1
          cp -f "$WS"/build.env "$D/" 2>/dev/null
          cp -f "$WS"/common/arch/arm64/configs/gki_defconfig "$D/defconfig/" 2>/dev/null
          cp -f "$WS"/common/arch/arm64/configs/vendor/*.config "$D/defconfig/" 2>/dev/null
          cp -f "$WS"/common/.scmversion "$D/" 2>/dev/null
          cp -f "$WS"/out/common/.config "$D/out/" 2>/dev/null
          cp -f "$WS"/out/common/include/config/kernel.release "$D/out/" 2>/dev/null
          du -sh "$D" 2>/dev/null
          find "$D" -type f | sed 's/^/  /'
          exit 0

      - name: 上传诊断日志（无论成功失败都传，方便排查）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-and-diagnostics
          if-no-files-found: warn
          retention-days: 14
          path: diag/**

      - name: 失败时把完整日志推到 ci-diag 分支（可匿名读取，用于远程排错）
        if: failure() && (inputs.push_diag_branch || 'true') == 'true'
        continue-on-error: true
        run: |
          # 为什么要推分支：
          #   Actions 的 job log 接口需要仓库 admin 权限（匿名 403），
          #   artifact 下载也需要 auth（匿名 401）—— 也就是说，如果只看 API，
          #   失败原因基本拿不到。而 git 分支是可以匿名 clone 的。
          #   所以失败时把 build.log + 关键中间产物推到一个独立分支 ci-diag，
          #   之后就能直接读到完整日志，不用再靠猜或让你手工复制粘贴。
          set -uo pipefail
          cd "$GITHUB_WORKSPACE"
          git config user.name  "kernel-ci"
          git config user.email "kernel-ci@localhost"
          mkdir -p diag
          {
            echo "run_id=${{ github.run_id }}  attempt=${{ github.run_attempt }}"
            echo "sha=${{ github.sha }}"
            echo "ws=$WS"
            echo
            echo "== df -h =="; df -h 2>&1
            echo; echo "== free -h =="; free -h 2>&1
            echo; echo "== kernel.release =="; cat "$WS/out/common/include/config/kernel.release" 2>&1
            echo; echo "== .scmversion =="; cat "$WS/common/.scmversion" 2>&1
            echo; echo "== upload/ =="; ls -la "$GITHUB_WORKSPACE/upload" 2>&1
            echo; echo "== AnyKernel3 工作目录 =="; ls -la "$GITHUB_WORKSPACE/AnyKernel3" 2>&1 | head -30
            echo; echo "== 仓库自带文件 =="; ls -la "$GITHUB_WORKSPACE/anykernel3" 2>&1
          } > diag/summary.txt 2>&1
          cp -f "$GITHUB_WORKSPACE/build.log" diag/ 2>/dev/null
          git checkout -B ci-diag
          git add -f diag
          git -c user.name=kernel-ci -c user.email=kernel-ci@localhost \
              commit -m "ci-diag: run ${{ github.run_id }} attempt ${{ github.run_attempt }} (${{ github.sha }})" \
              || echo "[i] 没有变更可提交"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
              ci-diag 2>&1 | tail -5
          echo "::notice title=诊断已推送:: 分支 ci-diag（含 build.log 与 summary.txt）"
